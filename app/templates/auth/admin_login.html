{% extends "base.html" %}
{% from "partials/macros.html" import csrf with context %}
{% block title %}Administrator login{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Administrator login</h1>
  <p class="muted">For authorised administrators only.</p>
  <form method="post" novalidate>
    {{ csrf() }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="button" type="submit">Log in as administrator</button>
  </form>
</section>
{% endblock %}
